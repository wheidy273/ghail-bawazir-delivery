name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter project
        run: |
          flutter --version
          flutter pub get

      - name: Generate Android platform if missing
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android .
          fi

      - name: Verify Android internet permission
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml was not generated"
            exit 1
          fi
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            echo "ERROR: INTERNET permission missing from AndroidManifest.xml"
            cat "$MANIFEST"
            exit 1
          fi
          echo "Android INTERNET permission found"

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi --dart-define=DEMO_AUTH_BYPASS=true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ghail-bawazir-delivery-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 7

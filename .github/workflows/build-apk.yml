name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter project
        run: |
          flutter --version
          flutter pub get

      - name: Generate Android platform if missing
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android .
          fi

      - name: Ensure Android internet permission
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          if not p.exists():
              raise SystemExit(f"Missing manifest: {p}")

          s = p.read_text()
          permission = 'android.permission.INTERNET'

          if permission not in s:
              marker = '<manifest'
              start = s.find(marker)
              end = s.find('>', start)
              if start < 0 or end < 0:
                  raise SystemExit("Cannot find manifest opening tag")

              s = s[:end + 1] + '\\n    <uses-permission android:name="android.permission.INTERNET" />' + s[end + 1:]
              p.write_text(s)

          if permission not in p.read_text():
              raise SystemExit("Failed to add INTERNET permission")

          print("Android INTERNET permission is present.")
          PYTHON

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi --dart-define=DEMO_AUTH_BYPASS=true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ghail-bawazir-delivery-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 7
